<!--form-container in index.html-->
<section class="project-section">

    <h2>Add a New Project</h2>
    <form id="project-form">
        <label for="project-name">Name</label>
        <input type="text" id="project-name" list="project-name-list" placeholder="Project name" autocomplete="off"
            required>
        <datalist id="project-name-list"></datalist>

        <label for="project-description">Description</label>
        <textarea id="project-description" rows="1" cols="10" placeholder="Project description" required></textarea>


        <label for="project-category">Category</label>
        <select id="project-category" required>
            <option value="frontEnd">frontEnd </option>
            <option value="backEnd">backEnd </option>
            <option value="ux">UX</option>
        </select>

        <label for="project-deadline">Deadline</label>
        <input type="date" id="project-deadline" required>

        <label for="project-created">Created</label>
        <input type="date" id="project-created" readonly>
        <datalist id="project-name-list"></datalist>

        <label for="project-member-name">Member</label>
        <input type="text" id="project-member-name" list="member-name-list" placeholder="Member name" required>
        <datalist id="member-name-list"></datalist>

        <label for="project-member-category">Member Category</label>
        <select id="project-member-category" required>
            <option value="owner">Owner </option>
            <option value="scrum master">Scrum Master </option>
            <option value="developer">Developer </option>
        </select>

        <label for="project-tasks">Tasks</label>
        <textarea id="project-tasks" rows="2" cols="10" placeholder="Task names, separated by commas"
            required></textarea>

        <label for="project-status">Status</label>
        <select id="project-status" required>
            <option value="toDo">To Do</option>
            <option value="inProgress">In Progress</option>
            <option value="done">Done</option>
        </select>

        <label for="project-priority">Priority</label>
        <select id="project-priority" required>
            <option value="low"> 🟢 low </option>
            <option value="medium">🟡 medium </option>
            <option value="high">🔴 high </option>
        </select>

        <button type="submit"> Add </button>
    </form>

</section>

<section class="project-section">
    <h2>Projects</h2>
    <div id="project-list"></div>
</section>
